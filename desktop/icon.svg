<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A0F2E"/>
      <stop offset="1" stop-color="#08040F"/>
    </linearGradient>
    <linearGradient id="neon" gradientUnits="userSpaceOnUse" x1="150" y1="132" x2="362" y2="392">
      <stop offset="0" stop-color="#FF2BD6"/>
      <stop offset="1" stop-color="#29E7FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF2BD6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FF2BD6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7C5CBE" stroke-opacity="0.16" stroke-width="2"/>
    </pattern>
  </defs>
  <!-- tile with two cut corners -->
  <path d="M0 0 H420 L512 92 V512 H92 L0 420 Z" fill="url(#tile)"/>
  <path d="M0 0 H420 L512 92 V512 H92 L0 420 Z" fill="url(#grid)"/>
  <path d="M5 5 H418 L507 94 V507 H94 L5 418 Z" fill="none" stroke="#3B2560" stroke-width="4"/>
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>
  <!-- circuit traces -->
  <g fill="none" stroke="#29E7FF" stroke-opacity="0.55" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60 140 H130 L160 170"/>
    <path d="M452 372 H382 L352 342"/>
  </g>
  <g fill="#29E7FF">
    <circle cx="60" cy="140" r="12"/>
    <circle cx="452" cy="372" r="12"/>
  </g>
  <!-- a stylised A: the prompt chevron turned up, with a crossbar -->
  <g fill="none" stroke="url(#neon)" stroke-width="34" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M150 392 L256 132 L362 392"/>
    <path d="M200 302 H312"/>
  </g>
  <!-- blinking-cursor block -->
  <rect x="226" y="408" width="60" height="18" fill="#C6FF3D"/>
</svg>
