name: Release

# Push a version tag (git tag v1.3.0 && git push origin v1.3.0) to build the
# Windows installers, have SignPath sign them, and open a draft GitHub release
# with the signed files. Review the draft, write the notes, then publish it.
#
# Needs, from the SignPath project (see .signpath/README.md):
#   secret   SIGNPATH_API_TOKEN
#   variable SIGNPATH_ORGANIZATION_ID
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tag matches package.json
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run check
      - name: Package the unsigned installers
        run: npm run package:desktop -- --publish never
      - name: Collect them under their release names
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          mkdir unsigned
          cp "release/Ambrosia Setup $v.exe" "unsigned/Ambrosia-Setup-$v.exe"
          cp "release/Ambrosia $v.exe" "unsigned/Ambrosia-$v-portable.exe"
      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: unsigned
          path: unsigned/
          if-no-files-found: error

  sign-and-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # The release-signing policy needs a manual approval in SignPath; the job waits up to an hour for it.
      - uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ambrosia
          signing-policy-slug: release-signing
          artifact-configuration-slug: installers
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
      - name: Draft the release with the signed files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd signed
          sha256sum -b *.exe > SHA256SUMS.txt
          {
            echo "Signed builds for ${GITHUB_REF_NAME}. Replace this with the release notes before publishing."
            echo
            echo '## Checksums (SHA-256)'
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "Ambrosia ${GITHUB_REF_NAME#v}" --notes-file notes.md *.exe
