<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FCEE0A" stroke-opacity="0.07" stroke-width="2"/>
    </pattern>
    <pattern id="hazard" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="24" fill="#FCEE0A"/>
    </pattern>
  </defs>
  <!-- black tile with two hard cuts -->
  <path d="M0 0 H404 L512 108 V512 H108 L0 404 Z" fill="#0A0A0C"/>
  <path d="M0 0 H404 L512 108 V512 H108 L0 404 Z" fill="url(#grid)"/>
  <path d="M6 6 H401 L506 111 V506 H111 L6 401 Z" fill="none" stroke="#FCEE0A" stroke-width="6"/>
  <!-- hazard tab along the top edge -->
  <rect x="44" y="34" width="150" height="16" fill="url(#hazard)"/>
  <!-- the A, split into red and cyan ghosts behind the yellow -->
  <g fill="none" stroke-width="36" stroke-linecap="square" stroke-linejoin="miter">
    <g stroke="#FF003C" transform="translate(-9 0)">
      <path d="M150 400 L256 136 L362 400"/>
      <path d="M198 306 H314"/>
    </g>
    <g stroke="#00F0FF" transform="translate(9 0)">
      <path d="M150 400 L256 136 L362 400"/>
      <path d="M198 306 H314"/>
    </g>
    <g stroke="#FCEE0A">
      <path d="M150 400 L256 136 L362 400"/>
      <path d="M198 306 H314"/>
    </g>
  </g>
  <!-- glitch slice -->
  <rect x="100" y="238" width="312" height="10" fill="#0A0A0C"/>
</svg>
